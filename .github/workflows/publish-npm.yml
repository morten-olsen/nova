name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish @morten-olsen/nova-game
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @morten-olsen/nova-game build

      - name: Match package version to release tag
        run: pnpm --filter @morten-olsen/nova-game exec npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: pnpm --filter @morten-olsen/nova-game publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
