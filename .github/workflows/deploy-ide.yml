name: Deploy IDE to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy (defaults to the branch this run was started from)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Pages serves a single site, so overlapping deploys race for it. Queue rather
# than cancel, so a release deploy is never dropped in favour of a later run.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build IDE
    runs-on: ubuntu-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Reports where Pages will serve this repository from. The IDE lives under
      # a repository sub-path, so the build needs the path before it runs.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build IDE
        run: pnpm --filter @morten-olsen/nova-ide build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Pages has no SPA rewrite, so a deep link would 404 before the router
      # ever loads. Serving index.html as the 404 page hands those URLs back to
      # the client router.
      - name: Add SPA fallback
        run: cp apps/ide/dist/index.html apps/ide/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/ide/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
